<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>🌌 Shared Playground — Ayden's Hub</title>
<meta name="description" content="Real-time, multi-user playground. See your friends' cursors. Phase 1 of the PlaygroundArchitect framework.">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { width: 100%; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
  /* Allow scroll for ScrollyTeller below the fold; the fixed cursor/particle/
     reaction layers stay pinned because they're position:fixed. */
  body {
    background:
      radial-gradient(circle at 20% 20%, #5b21b6 0%, transparent 55%),
      radial-gradient(circle at 80% 80%, #0e7490 0%, transparent 55%),
      radial-gradient(circle at 50% 100%, #be185d 0%, transparent 60%),
      #0a0e14;
    color: #f1f4ff;
    font-family: 'Russo One', 'Rubik', system-ui, sans-serif;
    /* Native cursor STAYS visible. The colored halo is decorative — players
       still need a real pointer for clicking links/buttons. */
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background-image:
      linear-gradient(rgba(168,85,247,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(168,85,247,.05) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  #playground-root { position: fixed; inset: 0; }
  noscript {
    display: block; padding: 30px; color: #f87171;
    font: 600 14px sans-serif; text-align: center;
  }
  /* Top-right escape hatch — kids can always get home, no matter what playground state they're in. */
  #pg-nav {
    position: fixed; top: 12px; left: 12px; z-index: 9000;
    display: flex; gap: 6px; flex-wrap: wrap;
    font: 700 10px/1 'Russo One', system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase;
  }
  #pg-nav a {
    color: #f1f4ff; text-decoration: none;
    padding: 7px 11px; border-radius: 4px;
    background: rgba(0,0,0,.55); border: 1px solid rgba(168,85,247,.5);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: all .12s;
  }
  #pg-nav a:hover {
    background: rgba(168,85,247,.18); border-color: #a855f7;
    box-shadow: 0 0 14px rgba(168,85,247,.5);
  }
  #pg-nav a.parent { border-color: rgba(255,255,255,.18); }
</style>
</head>
<body>

<nav id="pg-nav" aria-label="Playground escape navigation">
  <a href="/">🏠 Home</a>
  <a href="/hub.html">🛠 Hub</a>
  <a href="/kids.html">🚀 Kids</a>
  <a class="parent" href="https://thatcomputerguy26.org" target="_blank" rel="noopener">🏢 Parent site</a>
</nav>

<noscript>This Playground needs JavaScript. Please enable it and reload.</noscript>

<!-- Firebase config — public values; safe to commit. -->
<script src="firebase-config.js?v=20260428b"></script>
<!-- Shared identity layer — gives the playground the same uid + display name + hue as kids.html and index.html -->
<script type="module" src="shared/firebase-identity.js?v=20260428m"></script>
<!-- Chat-monitor + global chat widget (same as home + hub) -->
<script src="shared/chat-monitor.js?v=20260428m" defer></script>
<script src="shared/chat-widget.js?v=20260428m" defer></script>

<!-- React 18 UMD (production). Sets window.React + window.ReactDOM. -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<!-- Mount point -->
<div id="playground-root"></div>

<!-- Phase 1 modules. Native ESM — no bundler, no Babel, no unsafe-eval. -->
<script type="module" src="./playground/main.js?v=20260428m"></script>
<script defer src="https://api.thatcomputerguy26.org/static/tcg-visitor.js"></script>
</body>
</html>
